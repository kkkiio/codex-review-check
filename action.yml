name: Codex Review Check
description: Block unresolved Codex review threads and optionally require Codex approval for the latest commit.
author: xieziheng

branding:
  icon: check-circle
  color: green

inputs:
  github-token:
    description: GitHub token used to read pull request review state.
    required: true
  pull-request:
    description: Numeric pull request number. Inferred from pull request and issue events when omitted.
    required: false
    default: ''
  codex-bot-logins:
    description: Comma-separated GitHub logins accepted as Codex review authors.
    required: false
    default: chatgpt-codex-connector,chatgpt-codex-connector[bot]
  grace-seconds:
    description: Seconds to wait for a current-head Codex lifecycle signal before failing with a review hint.
    required: false
    default: '60'
  review-timeout-seconds:
    description: Maximum seconds to wait after Codex review liveness is observed.
    required: false
    default: '1800'
  poll-interval-seconds:
    description: Seconds between GitHub state reads while waiting.
    required: false
    default: '10'
  terminal-settle-seconds:
    description: Seconds to let review threads propagate after a terminal review signal appears.
    required: false
    default: '15'
  require-lgtm:
    description: Require an LGTM (a 👍 reaction or a 'Didn't find any major issues' comment) attesting the current HEAD. Default false accepts the most recent completed Codex review once its threads are resolved.
    required: false
    default: 'false'
  review-hint:
    description: Whether failures suggest the manual gh pr comment review request. Use suppress when Codex reviews every push automatically. Accepted values are suggest and suppress.
    required: false
    default: suggest

outputs:
  state:
    description: 'Final state reported by the action: success or failure.'
  reason:
    description: Machine-readable final reason.
  head-sha:
    description: Current pull request HEAD read from GitHub during this run.
  review-signal:
    description: Codex review or blocking signal selected by the action.
  unresolved-count:
    description: Number of unresolved Codex review threads blocking this check.
  review-hint:
    description: gh command that requests Codex review. Populated when the action suggests a manual review request for the current HEAD.

runs:
  using: node24
  main: dist/index.js
